<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gambia Elections 2026 — Independent Civic Analytics</title>
    <meta
      name="description"
      content="Independent, open-source analytics for The Gambia's 5 December 2026 presidential election: the verified record since 1996, the four contesting blocs, and a transparent forecasting model you can interrogate."
    />
    <meta name="theme-color" content="#1F6F8B" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%231F6F8B'/%3E%3Crect x='4' y='6' width='16' height='3.2' rx='1' fill='%23CE1126'/%3E%3Crect x='4' y='10.4' width='16' height='3.2' rx='1' fill='%23F5F5F5'/%3E%3Crect x='4' y='14.8' width='16' height='3.2' rx='1' fill='%233A7728'/%3E%3C/svg%3E" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Gambia Elections 2026 — Independent Civic Analytics" />
    <meta
      property="og:description"
      content="The verified electoral record since 1996, the four blocs contesting 5 December 2026, and a transparent forecasting model. Not affiliated with the IEC."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <script>
      // Apply the stored theme before first paint, so there is no flash of
      // the wrong colour scheme on load.
      (function () {
        try {
          var stored = localStorage.getItem('gm26:theme');
          var dark =
            stored === 'dark' ||
            (stored === null && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width: 40rem; margin: 4rem auto; padding: 0 1rem; font-family: system-ui, sans-serif; line-height: 1.6">
        <h1>Gambia Elections 2026</h1>
        <p>
          This platform needs JavaScript to run its forecasting model in your browser. For official
          election information, including the register, the certified candidate list and the
          official results, go to the
          <a href="https://iec.gm/">Independent Electoral Commission</a>.
        </p>
        <p>
          <strong>The Gambia votes on 5 December 2026</strong> in a single-round presidential
          election.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
